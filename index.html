<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costabella Gastón — DWM3AP - 2026</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- header con logo y menu, se repite en todas las paginas -->
  <header class="header">
    <a href="./index.html" class="header__logo">
      <img src="./img/logo.svg" alt="MultiversoRickAndMorty - Ir al inicio" width="48" height="48">
    </a>

    <nav class="nav" aria-label="Navegación principal">
      <ul class="nav__lista">
        <li><a href="./index.html" aria-current="page">Inicio</a></li>
        <li><a href="./favoritos.html">Favoritos</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <h1>Personajes de Rick and Morty</h1>

    <!-- buscador -->
    <section class="buscador" aria-labelledby="titulo-buscador">
      <h2 id="titulo-buscador">Buscar personaje</h2>
      <form id="form-busqueda" class="buscador__form" role="search">
        <label for="input-busqueda">Nombre del personaje</label>
        <input type="search" id="input-busqueda" name="nombre" placeholder="Ej: Morty" autocomplete="off">
        <button type="submit">Buscar</button>
      </form>
    </section>

    <!-- aca aparecen los mensajes de cargando / error / sin resultados -->
    <div id="estado" class="estado" aria-live="polite"></div>

    <!-- listado, las tarjetas las mete el js -->
    <section class="listado" aria-labelledby="titulo-listado">
      <h2 id="titulo-listado">Personajes</h2>
      <ul id="lista-personajes" class="grilla"></ul>
    </section>

  </main>

  <footer class="footer">
    <p>Gastón Costabella — Aplicaciones Web Progresivas</p>
    <p>Turno Mañana · Comisión DWM3AP · 2026</p>
  </footer>

  <!-- es module asi puedo usar import/export. hay que abrirlo con live server -->
  <script type="module" src="./js/inicio.js"></script>
</body>
</html>
